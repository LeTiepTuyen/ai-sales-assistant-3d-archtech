        // Render Sidebar List DOM Elements
        function renderPromptList() {
            const container = document.getElementById('promptList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filtered = promptDataset.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchVal) || 
                                      p.useCase.toLowerCase().includes(searchVal) || 
                                      p.template.toLowerCase().includes(searchVal);
                const matchesCategory = activeCategory === 'All' || p.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-sm text-slate-400 font-medium">No prompt models match criteria</div>`;
                return;
            }

            filtered.forEach(p => {
                const isSelected = p.id === selectedPromptId;
                const card = document.createElement('div');
                card.className = `p-4 cursor-pointer transition-all border-l-4 ${isSelected ? 'bg-indigo-50/70 border-indigo-600' : 'border-transparent hover:bg-slate-50'} flex flex-col space-y-2`;
                card.onclick = () => selectPrompt(p.id);
                
                // Set explicit color badges per metadata classification
                let badgeColor = "bg-slate-100 text-slate-700";
                if(p.category === "Strategy") badgeColor = "bg-amber-50 text-amber-700 border border-amber-200";
                if(p.category === "Execution") badgeColor = "bg-sky-50 text-sky-700 border border-sky-200";
                if(p.category === "Client") badgeColor = "bg-purple-50 text-purple-700 border border-purple-200";

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-sm ${badgeColor}">${p.category}</span>
                        <span class="text-[11px] font-mono text-slate-400">ID: #0${p.id}</span>
                    </div>
                    <h4 class="text-sm font-semibold text-slate-800 leading-tight">${p.useCase}</h4>
                    <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${p.title}</p>
                `;
                container.appendChild(card);
            });
        }

        // Handle Active Selection Shifts
        function selectPrompt(id) {
            selectedPromptId = id;
            const promptObj = promptDataset.find(p => p.id === id);
            if (!promptObj) return;

            // Paint Metadata Header
            document.getElementById('metaCategory').innerText = promptObj.category;
            document.getElementById('metaTitle').innerText = promptObj.title;

            // Re-render structural navigation adjustments
            const cards = document.getElementById('promptList').children;
            renderPromptList();

            // Auto-detect bracket configurations inside prompt model text via regex parsing
            const variableRegex = /\[([A-Z0-9_\s&/]+)\]/g;
            let match;
            const uniqueVariables = new Set();
            
            while ((match = variableRegex.exec(promptObj.template)) !== null) {
                uniqueVariables.add(match[1]);
            }

            // Build Dynamic Input Elements DOM Layout
            const inputContainer = document.getElementById('dynamicInputs');
            inputContainer.innerHTML = '';

            if (uniqueVariables.size === 0) {
                inputContainer.innerHTML = `<p class="text-xs text-slate-400 italic">No variables required for this structural model.</p>`;
            } else {
                uniqueVariables.forEach(variable => {
                    const formGroup = document.createElement('div');
                    formGroup.className = "flex flex-col space-y-1.5";
                    
                    formGroup.innerHTML = `
                        <label class="text-xs font-bold text-slate-700 uppercase tracking-wide flex items-center justify-between">
                            <span>${variable}</span>
                            <span class="text-[10px] text-slate-400 font-normal normal-case">Inject target values</span>
                        </label>
                        <textarea data-var="[${variable}]" oninput="compileLivePrompt()" placeholder="Enter details for [${variable}]..." 
                                  rows="2" class="w-full text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-hidden focus:bg-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-sans resize-none"></textarea>
                    `;
                    inputContainer.appendChild(formGroup);
                });
            }

            compileLivePrompt();
        }

        // Real-Time Compilation Engine
        function compileLivePrompt() {
            const promptObj = promptDataset.find(p => p.id === selectedPromptId);
            if (!promptObj) return;

            let compiledText = promptObj.template;
            const inputs = document.querySelectorAll('#dynamicInputs textarea');
            
            inputs.forEach(input => {
                const targetPlaceholder = input.getAttribute('data-var');
                const userText = input.value.trim();
                
                if (userText) {
                    // Replace variables globally safely
                    compiledText = compiledText.split(targetPlaceholder).join(userText);
                }
            });

            // Handle visual markup highlights for remaining unfulfilled values
            const displayPanel = document.getElementById('promptPreview');
            
            // Clean HTML escaping to keep display safe
            let securedHtml = compiledText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Visually transform standard tracking tags for readability inside dashboard preview panel
            securedHtml = securedHtml.replace(/(\[[A-Z0-9_\s&/]+\])/g, `<span class="bg-indigo-950 text-indigo-400 border border-indigo-800 px-1 rounded-sm font-bold">$1</span>`);

            displayPanel.innerHTML = securedHtml;
        }

        // Sidebar Text Search Pipeline
        function filterPrompts() {
            renderPromptList();
        }

        // Category Tab Switch Control
        function filterCategory(categoryName) {
            activeCategory = categoryName;
            
            // Reset active styles across tabs
            const tabs = document.querySelectorAll('#categoryTabs button');
            tabs.forEach(t => {
                t.className = "px-3 py-1 text-xs font-semibold rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 cursor-pointer transition-all";
            });

            // Target Selected Tab styling elements
            const activeTab = document.getElementById(`tab-${categoryName}`);
            if(activeTab) {
                activeTab.className = "px-3 py-1 text-xs font-semibold rounded-full bg-indigo-600 text-white shadow-xs cursor-pointer transition-all";
            }

            renderPromptList();
        }

        // Copy Clipboard Utilities
        function copyRawPrompt() {
            const promptObj = promptDataset.find(p => p.id === selectedPromptId);
            if (!promptObj) return;
            navigator.clipboard.writeText(promptObj.template).then(() => {
                showFeedbackPopup("Base structure copied to clipboard!");
            });
        }

        function copyFilledPrompt() {
            // Target compiled state text block contents directly without parsing localized DOM styles element injections
            const promptObj = promptDataset.find(p => p.id === selectedPromptId);
            if (!promptObj) return;

            let compiledText = promptObj.template;
            const inputs = document.querySelectorAll('#dynamicInputs textarea');
            inputs.forEach(input => {
                const targetPlaceholder = input.getAttribute('data-var');
                const userText = input.value.trim();
                if (userText) {
                    compiledText = compiledText.split(targetPlaceholder).join(userText);
                }
            });

            navigator.clipboard.writeText(compiledText).then(() => {
                showFeedbackPopup("Compiled prompt ready for deployment!");
            });
        }

        // Non-intrusive operational UI confirmation banner system
        function showFeedbackPopup(msg) {
            const banner = document.createElement('div');
            banner.className = "fixed bottom-5 right-5 bg-slate-800 text-slate-100 px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium border border-slate-700 tracking-wide z-50 animate-bounce flex items-center space-x-2";
            banner.innerHTML = `
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span>${msg}</span>
            `;
            document.body.appendChild(banner);
            setTimeout(() => { banner.remove(); }, 2500);
        }

        // Initialize Core System Lifecycle
        window.onload = initApp;
    </script>
</body>
</html>
